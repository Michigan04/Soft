<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications - IITM Risk Platform</title>
<link rel="stylesheet" href="../shared/main.css" />
<link rel="stylesheet" href="../shared/layout.css" />
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/nav.js"></script>
<script src="../shared/components.js"></script>
<style>
  .notif-row { display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px; border-bottom: 1px solid var(--color-border); }
  .notif-row:last-child { border-bottom: none; }
  .notif-row.unread { background: #faf5f6; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <app-shell v-if="user" :user="user">
    <div class="page">
      <div class="page-header">
        <div>
          <div class="page-title">Notifications</div>
          <div class="page-subtitle">{{ unreadCount }} unread of {{ items.length }} total.</div>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-secondary btn-sm" :class="{ active: filter === 'all' }" @click="filter = 'all'">All</button>
          <button class="btn btn-secondary btn-sm" :class="{ active: filter === 'unread' }" @click="filter = 'unread'">Unread</button>
        </div>
      </div>

      <loading-state v-if="loading" :rows="6"></loading-state>
      <empty-state v-else-if="filtered.length === 0" title="No notifications" message="You're all caught up."></empty-state>
      <div v-else class="card">
        <div v-for="n in filtered" :key="n.id" class="notif-row" :class="{ unread: !n.is_read }">
          <severity-badge :severity="n.severity"></severity-badge>
          <div style="flex: 1">
            <div style="font-weight: 600; font-size: 13.5px">{{ n.title }}</div>
            <div class="text-sm" style="margin: 2px 0">{{ n.message }}</div>
            <div class="text-muted text-sm">
              {{ new Date(n.created_at).toLocaleString() }} &middot;
              <span style="text-transform: capitalize">{{ n.notification_type.replace("_", " ") }}</span>
            </div>
          </div>
          <button v-if="!n.is_read" class="btn btn-secondary btn-sm" @click="markRead(n.id)">Mark read</button>
        </div>
      </div>
    </div>
  </app-shell>
</div>
<script>
  const { createApp } = Vue;
  createApp({
    components: {
      AppShell: Components.AppShell,
      SeverityBadge: Components.SeverityBadge,
      LoadingState: Components.LoadingState,
      EmptyState: Components.EmptyState,
    },
    data() {
      return { user: null, items: [], loading: true, filter: "all" };
    },
    computed: {
      unreadCount() {
        return this.items.filter((n) => !n.is_read).length;
      },
      filtered() {
        return this.filter === "unread" ? this.items.filter((n) => !n.is_read) : this.items;
      },
    },
    methods: {
      async markRead(id) {
        await Api.notifications.markNotificationRead(id);
        const item = this.items.find((n) => n.id === id);
        if (item) item.is_read = true;
      },
    },
    async mounted() {
      this.user = await Auth.requireUser(["admin", "faculty", "ta", "student"]);
      if (!this.user) return;
      const { data } = await Api.notifications.listNotifications();
      this.items = data;
      this.loading = false;
    },
  }).mount("#app");
</script>
</body>
</html>
