<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview: RiskDistributionChart</title>
<link rel="stylesheet" href="../../shared/main.css" />
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
<script src="../../shared/charts.js"></script>
</head>
<body style="padding: 24px">
<div id="app" v-cloak>
  <h2 style="margin-bottom: 16px">RiskDistributionChart</h2>
  <div class="card card-pad" style="max-width: 420px; height: 320px">
    <risk-distribution-chart :items="items"></risk-distribution-chart>
  </div>
</div>
<script>
  const { createApp } = Vue;
  createApp({
    components: { RiskDistributionChart: Charts.RiskDistributionChart },
    data() {
      return {
        items: [
          { risk_level: "low", count: 52 },
          { risk_level: "moderate", count: 18 },
          { risk_level: "high", count: 9 },
          { risk_level: "critical", count: 3 },
        ],
      };
    },
  }).mount("#app");
</script>
</body>
</html>
