<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview: RiskTrendChart</title>
<link rel="stylesheet" href="../../shared/main.css" />
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
<script src="../../shared/charts.js"></script>
</head>
<body style="padding: 24px">
<div id="app" v-cloak>
  <h2 style="margin-bottom: 16px">RiskTrendChart</h2>
  <div class="card card-pad" style="max-width: 640px; height: 320px">
    <risk-trend-chart :items="items"></risk-trend-chart>
  </div>
</div>
<script>
  const { createApp } = Vue;
  createApp({
    components: { RiskTrendChart: Charts.RiskTrendChart },
    data() {
      return {
        items: [
          { period: "2026-07", low: 40, moderate: 10, high: 4, critical: 1 },
          { period: "2026-08", low: 38, moderate: 13, high: 5, critical: 2 },
          { period: "2026-09", low: 35, moderate: 15, high: 7, critical: 3 },
        ],
      };
    },
  }).mount("#app");
</script>
</body>
</html>
