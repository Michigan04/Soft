services:
  postgres:
    image: postgres:16-alpine
    container_name: risk_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_platform_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-risk_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
